name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile src/worker.py scripts/verify-delivery.py
